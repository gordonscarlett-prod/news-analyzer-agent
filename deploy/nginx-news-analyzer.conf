# Install: sudo cp deploy/nginx-news-analyzer.conf /etc/nginx/sites-available/news-analyzer
#          sudo ln -s /etc/nginx/sites-available/news-analyzer /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl restart nginx
#
# Serves the production React build as static files and reverse-proxies
# /api/* to the uvicorn backend running locally on 127.0.0.1:8010 (started
# by news-analyzer-backend.service). Same-origin, so no CORS config needed —
# the frontend already calls /api/... as a relative path.

server {
    listen 80;
    server_name _;

    root /opt/news-analyzer/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
